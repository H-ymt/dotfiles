[vars]
github_username = "H-ymt"

[bootstrap.packages]
# 純粋な単体 CLI は Phase 1 で Nix (nix/home.nix の home.packages) へ移した。
# ここに残るのは Nix へ移せない/移していないものだけ。issue #1 参照。
#
# nixpkgs 未収録のため Homebrew に残す:
"brew:crit" = "latest"
"brew:herdr" = "latest"
"brew:vercel-cli" = "latest"
# docker CLI は brew-cask:orbstack が同梱する（~/.orbstack/bin/docker → OrbStack.app）。
# daemon 提供元（OrbStack）と CLI 提供元を一致させるため、Homebrew formula の docker は
# 持たない。postgresql@14 は Phase 1.5 で不要と判断し完全に削除した（DB ごと）。
# codex cask が depends_on: formula: [ripgrep] を宣言しているため Homebrew に残す。
# Nix 版と二重管理しないよう home.packages には入れない
"brew:ripgrep" = "latest"

"brew-cask:dockdoor" = "latest"
"brew-cask:claude" = "latest"
"brew-cask:codex" = "latest"
"brew-cask:copilot-cli" = "latest"
"brew-cask:cursor" = "latest"
"brew-cask:figma" = "latest"
"brew-cask:font-ibm-plex-mono" = "latest"
"brew-cask:font-plemol-jp" = "latest"
"brew-cask:font-plemol-jp-nf" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:karabiner-elements" = "latest"
"brew-cask:keycastr" = "latest"
"brew-cask:local" = "latest"
"brew-cask:macwinzipper" = "latest"
"brew-cask:notion" = "latest"
"brew-cask:obsidian" = "latest"
"brew-cask:orbstack" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:thaw" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:wezterm" = "latest"
"brew-cask:zed" = "latest"
"brew-cask:zipic" = "latest"

# mise の brew マネージャー非対応。ここに追加すると bootstrap が中断するため
# 宣言せず手動でインストールする。新 PC セットアップ時はこの一覧を消化すること。
#
# pkg installer 形式:
#   adobe-creative-cloud, logi-options+, microsoft-teams
#     -> brew install --cask <name>
# tap が API metadata 未公開:
#   linear-linear
#     -> brew install --cask linear-linear
#   ax
#     -> brew install yusukebe/tap/ax（現状は ~/.local/bin に Bun 製バイナリを配置済み）
# cask が postflight_steps を使用:
#   ngrok
#     -> brew install --cask ngrok

[bootstrap.hooks.post-packages]
run = [
  "gh auth status >/dev/null 2>&1 && gh extension list | grep -q seachicken/gh-poi || gh extension install seachicken/gh-poi 2>/dev/null || true",
]

[bootstrap.hooks.post-dotfiles]
run = [
  "apm install --target all",
  "bat cache --build || true",
]

[dotfiles]
