[vars]
github_username = "H-ymt"

[bootstrap.packages]
# 純粋な単体 CLI は Phase 1 で Nix (nix/home.nix の home.packages) へ移した。
# ここに残るのは Nix へ移せない/移していないものだけ。issue #1 参照。
#
# nixpkgs 未収録のため Homebrew に残す:
"brew:crit" = "latest"
"brew:herdr" = "latest"
"brew:vercel-cli" = "latest"
# docker CLI は brew-cask:orbstack が同梱する（~/.orbstack/bin/docker → OrbStack.app）。
# daemon 提供元（OrbStack）と CLI 提供元を一致させるため、Homebrew formula の docker は
# 持たない。postgresql@14 は Phase 1.5 で不要と判断し完全に削除した（DB ごと）。
# codex cask が depends_on: formula: [ripgrep] を宣言しているため Homebrew に残す。
# Nix 版と二重管理しないよう home.packages には入れない
"brew:ripgrep" = "latest"

# cask（GUI アプリ）は Phase 2 で nix-darwin の homebrew.casks へ移した（nix/darwin.nix）。
# 従来 mise の brew マネージャーが非対応だった pkg installer / postflight_steps 形式の
# cask（adobe-creative-cloud / logi-options+ / microsoft-teams / ngrok）も、nix-darwin の
# brew bundle は通常の brew と同じ挙動なので同じく宣言できるようになった。
#
# ax だけは formula（yusukebe/tap/ax）かつ現状 ~/.local/bin に Bun 製バイナリを配置して
# 運用しているため、ここにも homebrew.casks にも入れず据え置く。tap の API metadata が
# 未公開で brew bundle でも扱いに難があるため、Nix / mise とは別管理を継続する。

# [bootstrap.hooks.*] は Phase 5 で nix/home.nix の home.activation へ移した。
# gh-poi extension / apm install / bat cache は darwin-rebuild switch のたびに走る。
# mise 側にフックを残すと同じ処理が二重に走るため、同じコミットで削除する。issue #1 参照。

[dotfiles]
# .zshrc / .gitconfig は Phase 4 で nix/home.nix の programs.zsh / programs.git へ移した。
"~/.bunfig.toml" = { source = ".bunfig.toml", mode = "symlink" }
"~/.claude/CLAUDE.md" = { source = ".claude/CLAUDE.md.tmpl", mode = "template" }

"~/.config/zed/keymap.json" = { source = ".config/zed/keymap.json", mode = "symlink" }
"~/.config/zed/settings.json" = { source = ".config/zed/settings.json", mode = "symlink" }

"~/.config/mise/config.toml" = { source = "mise.toml", mode = "symlink" }

# nvim / wezterm / starship / yazi / bat / karabiner / ghostty は Phase 3 で
# nix/home.nix の xdg.configFile へ移した。書き込みが発生する nvim（lazy-lock.json）と
# karabiner.json（GUI が書き換え）は mkOutOfStoreSymlink、それ以外は Nix store 経由。
#
# ここに残るのは Phase 3 / 4 対象外のもの:
# - sheldon / zsh-abbr: sheldon は zsh-defer による遅延ロードを使っており、programs.zsh.plugins に
#   defer 相当がないため Phase 4 でも mise に残す。zsh-abbr は sheldon 経由でロードされるので同様。
#   .zshrc 本体は programs.zsh へ移したが、eval "$(sheldon source)" は initContent に残してある
# - herdr: config.toml のみ管理（session.json / *.log / *.sock は実行時生成物で管理外）
# - zed: verbatim 継続
"~/.config/sheldon/plugins.toml" = { source = ".config/sheldon/plugins.toml", mode = "symlink" }

"~/.config/herdr/config.toml" = { source = ".config/herdr/config.toml", mode = "symlink" }

"~/.config/zsh-abbr/user-abbreviations" = { source = ".config/zsh-abbr/user-abbreviations", mode = "symlink" }

[tools]
# --- ランタイム (固定) ---
node = "24.15.0"
pnpm = "11.17.0"
bun = "latest"
yarn = "4.12.0"

# --- テスト/計測 (固定: スクリプトとの一致が必要) ---
"npm:playwright" = "1.59.1"
"npm:@playwright/cli" = "latest"
"npm:@playwright/mcp" = "0.0.68"
"npm:lighthouse" = "13.0.3"

# --- CLI ユーティリティ (latest: API 安定・バグ修正追従) ---
"npm:@antfu/ni" = "latest"
"npm:hunkdiff" = "latest"
"npm:resend-cli" = "latest"
"npm:portless" = "latest"
"npm:oxfmt" = "latest"
"npm:wp-studio" = "latest"
"npm:@nulab/bee" = "latest"
"npm:@googleworkspace/cli" = "latest"
"npm:agent-browser" = "latest"
"npm:linearis" = "latest"
"npm:xserver-cli" = "latest"

# npm backend (npm:@anthropic-ai/claude-code) と併用すると PATH が衝突するため core のみ
claude-code = "latest"
