# sheldon configuration
# https://sheldon.cli.rs/

shell = "zsh"

[plugins]

# ========================================
# Completions (must be loaded first)
# ========================================
[plugins.zsh-completions]
github = "zsh-users/zsh-completions"

[plugins.zsh-autocomplete]
github = "marlonrichert/zsh-autocomplete"

# ========================================
# oh-my-zsh library and plugins
# ========================================
[plugins.ohmyzsh-lib]
github = "ohmyzsh/ohmyzsh"
dir = "lib"
use = [
  "completion.zsh",
  "directories.zsh",
  "git.zsh",
  "history.zsh",
  "key-bindings.zsh",
]

# ========================================
# Syntax highlighting and autosuggestions (deja)
# ========================================
# deja は zsh-autosuggestions の置き換え。併用すると deja 側が無効化されるため入れない。
# バイナリは nix/home.nix の home.packages で導入する。上流の deja.plugin.zsh と同じ処理を
# inline で持ち、リポジトリ全体の clone を避ける。init.zsh は deja がバイナリ更新時に自動で再生成する。
[plugins.deja]
inline = '''
# 既定の fg=8 は端末パレット次第で入力文字と見分けにくいため、catppuccin mocha の surface2 で薄く出す。
# init.zsh は `: ${DEJA_HIGHLIGHT_STYLE:=...}` で未設定時のみ既定値を入れるので、source 前に定義する。
typeset -g DEJA_HIGHLIGHT_STYLE='fg=#585b70'
if (( $+commands[deja] )); then
  if [[ -r "$HOME/.local/share/deja/init.zsh" ]]; then
    source "$HOME/.local/share/deja/init.zsh"
  else
    eval "$(deja init zsh)"
  fi

  # zsh-autocomplete は非同期補完の後、region_highlight を退避時点の内容へ巻き戻し、
  # zsh-autosuggestions 用の _zsh_autosuggest_highlight_apply だけを呼び直す。
  # deja のゴースト色がそこで消えて入力文字と同じ前景色になるため、同名関数で deja の再適用を差し込む。
  if (( $+functions[_deja_highlight_apply] )); then
    _zsh_autosuggest_highlight_apply() {
      _deja_highlight_reset
      _deja_highlight_apply
    }
  fi
fi
'''

# syntax-highlighting must be loaded last
[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"

# ========================================
# zsh-abbr (abbreviations - must be after zsh-autocomplete)
# ========================================
[plugins.zsh-abbr]
github = "olets/zsh-abbr"

# ========================================
# Deferred loading for faster startup
# ========================================
[templates]
defer = "{{ hooks?.pre | nl }}{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}{{ hooks?.post | nl }}"
